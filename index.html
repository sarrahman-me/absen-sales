<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <!-- Cubit-untuk-perbesar sengaja tidak dikunci: sales sering perlu memperbesar
       peta atau teks catatan. Semua kolom isian berukuran 16px supaya iOS tidak
       ikut memperbesar layar sendiri saat kolom disentuh. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Zona - Absensi Sales Samarinda</title>

  <meta name="theme-color" content="#312e81">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Tinggi bilah bawah + area aman iPhone, dipakai sebagai jarak dasar
         supaya tidak ada tombol yang tertutup batang beranda. */
      --aman-bawah: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overscroll-behavior-y: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* Satuan dvh mengikuti bilah alamat peramban HP yang muncul-hilang saat
       digulir; 100vh membuat bagian bawah terpotong di Safari. */
    .tinggi-layar { height: 100vh; height: 100dvh; }

    #map { position: absolute; inset: 0; z-index: 1; }

    /* Elemen antarmuka tidak bisa disorot supaya seret peta terasa mulus,
       tapi teks catatan tetap bisa disalin. */
    header, nav, button, label { user-select: none; }

    .leaflet-touch .leaflet-bar { border: none; box-shadow: 0 4px 12px rgb(15 23 42 / .12); }
    .leaflet-container { font-family: inherit; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

    .kartu-lembut { box-shadow: 0 1px 2px rgb(15 23 42 / .04), 0 8px 24px -12px rgb(15 23 42 / .18); }
    .naik { animation: naik .22s cubic-bezier(.32, .72, 0, 1); }
    @keyframes naik { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
    .redup-masuk { animation: redup .18s ease-out; }
    @keyframes redup { from { opacity: 0 } to { opacity: 1 } }

    .denyut { animation: denyut 1.4s ease-in-out infinite; }
    @keyframes denyut { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

    /* Batas dua baris. Dipasang pada elemen tanpa jarak dalam sendiri —
       kalau elemen ber-padding, sisa baris berikutnya ikut terlihat. */
    .baris-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-900 tinggi-layar flex flex-col overflow-hidden">

  <!-- ================= HEADER ================= -->
  <header class="bg-gradient-to-r from-indigo-900 to-indigo-700 text-white shrink-0 z-30 shadow-lg"
    style="padding-top: env(safe-area-inset-top, 0px)">
    <div class="mx-auto w-full max-w-7xl px-3 sm:px-5 h-14 sm:h-16 flex items-center justify-between gap-3">

      <div class="flex items-center gap-2.5 min-w-0">
        <div class="bg-white/15 ring-1 ring-white/25 w-9 h-9 rounded-xl grid place-items-center shrink-0">
          <i class="fa-solid fa-location-crosshairs"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-[15px] leading-tight truncate">My Zona</h1>
          <button onclick="changeSalesName()"
            class="flex items-center gap-1 text-[11px] text-indigo-200 hover:text-white transition max-w-full">
            <i class="fa-solid fa-user text-[9px]"></i>
            <span id="display-sales-name" class="truncate font-medium">Sales Samarinda</span>
            <i class="fa-solid fa-pen text-[8px] opacity-70"></i>
          </button>
        </div>
      </div>

      <button id="sync-badge" onclick="sinkronkanSekarang()" aria-label="Status pengiriman data"
        class="shrink-0 text-[11px] font-semibold px-2.5 sm:px-3 py-1.5 rounded-full text-white flex items-center gap-1.5 shadow-sm ring-1 ring-white/20 active:scale-95 transition bg-slate-500">
        <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-white"></span>
        <span id="sync-text">Memeriksa...</span>
      </button>
    </div>
  </header>

  <!-- ================= ISI ================= -->
  <!-- Di layar lebar peta dan riwayat tampil berdampingan; di HP bergantian
       lewat bilah tab bawah. -->
  <main class="flex-1 min-h-0 w-full flex flex-col lg:grid lg:grid-cols-[minmax(0,1fr)_400px] xl:grid-cols-[minmax(0,1fr)_460px]">

    <!-- ---- PETA ---- -->
    <section id="view-map" class="relative flex-1 min-h-0 w-full">
      <div id="map"></div>

      <!-- Panel melayang: keterangan lokasi + tombol utama -->
      <div class="absolute inset-x-3 sm:inset-x-4 bottom-3 sm:bottom-4 z-[1000] pointer-events-none">
        <div class="mx-auto max-w-md lg:mx-0 flex flex-col items-stretch gap-2.5">

          <div class="flex justify-end">
            <button onclick="getCurrentLocation()" aria-label="Cari posisi saya sekarang"
              class="pointer-events-auto w-11 h-11 bg-white text-indigo-700 rounded-full kartu-lembut grid place-items-center text-lg active:scale-95 transition ring-1 ring-slate-200">
              <i id="ikon-gps" class="fa-solid fa-crosshairs"></i>
            </button>
          </div>

          <div class="pointer-events-auto bg-white/95 backdrop-blur rounded-2xl kartu-lembut ring-1 ring-slate-200 p-3 sm:p-3.5">
            <div class="flex items-center gap-2 mb-1.5">
              <span id="gps-accuracy-badge"
                class="text-[11px] font-bold text-indigo-700 bg-indigo-50 ring-1 ring-indigo-100 px-2 py-0.5 rounded-full">Menunggu GPS...</span>
            </div>
            <div class="font-bold text-slate-900 text-[15px] leading-tight truncate" id="live-address-title">Mendeteksi...</div>
            <div class="text-[11px] text-slate-500 leading-snug baris-2 mt-0.5" id="live-address-detail">Mohon tunggu sebentar...</div>

            <button onclick="openAbsenModal()"
              class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-[15px] flex justify-center items-center gap-2 shadow-lg shadow-indigo-600/25 active:scale-[.98] transition">
              <i class="fa-solid fa-camera"></i> Absen Disini
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---- RIWAYAT ---- -->
    <!-- "hidden" menang atas "flex" karena Tailwind menaruhnya belakangan,
         jadi tampil/sembunyi cukup diatur dengan menambah/membuang satu kelas. -->
    <section id="view-list"
      class="hidden flex flex-col flex-1 min-h-0 bg-slate-50 lg:border-l lg:border-slate-200">

      <div class="shrink-0 bg-white border-b border-slate-200 px-3 sm:px-4 py-3">
        <div class="hidden lg:flex items-center justify-between mb-3">
          <h2 class="font-bold text-slate-800 text-sm">Riwayat Kunjungan</h2>
          <span class="text-[11px] text-slate-500"><span id="count-proyek-lg">0</span> tersimpan di HP ini</span>
        </div>
        <!-- Di tablet daftar dibatasi lebarnya supaya baris teks tidak terlalu
             panjang; di kolom samping layar besar batas ini tidak berpengaruh. -->
        <div class="flex gap-2 mx-auto w-full max-w-3xl">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="search-input" onkeyup="renderProyekList()" placeholder="Cari toko / kelurahan..."
              class="w-full pl-9 pr-3 py-2.5 bg-slate-100 border border-transparent focus:bg-white focus:border-indigo-300 rounded-xl text-[15px] outline-none focus:ring-2 focus:ring-indigo-500/30 transition">
          </div>
          <button onclick="exportToCSV()" aria-label="Export riwayat ke CSV"
            class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 rounded-xl text-[13px] font-bold flex items-center gap-1.5 active:scale-95 transition shrink-0">
            <i class="fa-solid fa-file-arrow-down"></i><span class="hidden sm:inline">Export</span>
          </button>
        </div>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto p-3 sm:p-4">
        <div id="proyek-container" class="mx-auto w-full max-w-3xl space-y-3"></div>
      </div>
    </section>
  </main>

  <!-- ================= TAB BAWAH (HP) ================= -->
  <nav class="lg:hidden shrink-0 bg-white border-t border-slate-200 z-30 shadow-[0_-4px_16px_-8px_rgb(15_23_42/.2)]"
    style="padding-bottom: var(--aman-bawah)">
    <div class="mx-auto max-w-md grid grid-cols-2">
      <button onclick="switchTab('map-view')" id="tab-map"
        class="py-2.5 flex flex-col items-center gap-0.5 text-[11px] font-semibold transition">
        <i class="fa-solid fa-map-location-dot text-[17px]"></i> Peta Absen
      </button>
      <button onclick="switchTab('list-view')" id="tab-list"
        class="py-2.5 flex flex-col items-center gap-0.5 text-[11px] font-semibold transition">
        <span class="relative">
          <i class="fa-solid fa-clock-rotate-left text-[17px]"></i>
          <span id="count-proyek"
            class="absolute -top-1.5 -right-3 min-w-[16px] h-4 px-1 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold grid place-items-center">0</span>
        </span>
        Riwayat
      </button>
    </div>
  </nav>

  <!-- ================= FORM ABSENSI ================= -->
  <div id="modal-absen"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] hidden items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white w-full sm:max-w-lg max-h-[92dvh] sm:max-h-[88dvh] rounded-t-3xl sm:rounded-2xl flex flex-col shadow-2xl overflow-hidden naik">

      <div class="shrink-0 sm:hidden pt-2.5 pb-1 grid place-items-center">
        <span class="w-10 h-1 rounded-full bg-slate-300"></span>
      </div>

      <div class="px-4 sm:px-5 py-3 flex justify-between items-center border-b border-slate-200 shrink-0">
        <div>
          <h3 class="font-bold text-slate-900 text-[15px]">Form Kunjungan Toko</h3>
          <p class="text-[11px] text-slate-500">Foto otomatis distempel GPS &amp; jam</p>
        </div>
        <button onclick="closeAbsenModal()" aria-label="Tutup form"
          class="w-9 h-9 rounded-full grid place-items-center text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="px-4 sm:px-5 py-4 overflow-y-auto flex-1 space-y-5">

        <!-- 1. Foto -->
        <div>
          <label class="flex items-center gap-1.5 font-bold text-slate-800 text-[13px] mb-2">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 text-[10px] grid place-items-center font-bold">1</span>
            Foto Toko <span class="text-red-500">*</span>
          </label>

          <div class="grid grid-cols-2 gap-2 mb-2.5">
            <label for="camera-env-input"
              class="bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold text-[13px] flex justify-center items-center gap-2 active:scale-[.98] transition cursor-pointer">
              <i class="fa-solid fa-camera"></i> Kamera
            </label>
            <label for="gallery-file-input"
              class="bg-white text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50 py-3 rounded-xl font-semibold text-[13px] flex justify-center items-center gap-2 active:scale-[.98] transition cursor-pointer">
              <i class="fa-regular fa-image"></i> Galeri
            </label>
            <input type="file" id="camera-env-input" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
            <input type="file" id="gallery-file-input" accept="image/*" class="hidden" onchange="previewImage(event)">
          </div>

          <div id="preview-placeholder"
            class="border-2 border-dashed border-slate-300 rounded-xl py-6 text-center bg-slate-50">
            <i class="fa-solid fa-camera-retro text-3xl text-slate-300"></i>
            <p class="text-[11px] text-slate-500 mt-1.5">Belum ada foto</p>
          </div>

          <div id="preview-container" class="hidden relative">
            <img id="img-preview" alt="Pratinjau foto toko"
              class="w-full aspect-[4/3] object-cover rounded-xl ring-1 ring-slate-200">
            <span class="absolute top-2 left-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">
              <i class="fa-solid fa-check"></i> Sudah distempel
            </span>
          </div>
        </div>

        <!-- 2. Nama toko -->
        <div>
          <label for="input-nama-proyek" class="flex items-center gap-1.5 font-bold text-slate-800 text-[13px] mb-2">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 text-[10px] grid place-items-center font-bold">2</span>
            Nama Toko / Klien <span class="text-red-500">*</span>
          </label>
          <input type="text" id="input-nama-proyek" placeholder="Contoh: TB. Makmur Jaya"
            class="w-full px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl text-[15px] outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition">
        </div>

        <!-- Tambahan -->
        <button type="button" onclick="toggleOptionalDetails()"
          class="w-full py-2.5 text-indigo-700 text-[13px] font-bold flex items-center justify-center gap-2 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition">
          <i id="toggle-icon" class="fa-solid fa-chevron-down text-[11px]"></i> Catatan Pesanan &amp; Rating (opsional)
        </button>

        <div id="optional-details" class="hidden space-y-4">
          <div>
            <label class="block font-bold text-slate-700 text-[12px] mb-1.5">Rating Potensi Toko</label>
            <div class="flex gap-1 text-2xl text-amber-400" id="rating-stars">
              <i class="fa-solid fa-star cursor-pointer p-1 active:scale-90 transition" onclick="setRating(1)"></i>
              <i class="fa-solid fa-star cursor-pointer p-1 active:scale-90 transition" onclick="setRating(2)"></i>
              <i class="fa-solid fa-star cursor-pointer p-1 active:scale-90 transition" onclick="setRating(3)"></i>
              <i class="fa-solid fa-star cursor-pointer p-1 active:scale-90 transition" onclick="setRating(4)"></i>
              <i class="fa-regular fa-star text-slate-300 cursor-pointer p-1 active:scale-90 transition" onclick="setRating(5)"></i>
            </div>
          </div>

          <div>
            <label for="input-deskripsi" class="font-bold text-slate-700 text-[12px] flex items-center gap-1.5 mb-1.5">
              <i class="fa-solid fa-clipboard-list text-indigo-600"></i> Catatan Pesanan / Follow Up
            </label>
            <textarea id="input-deskripsi" rows="4"
              placeholder="Cth: Keramik 60x60 = 5 dus, minta penawaran semen..."
              class="w-full px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl text-[15px] outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 resize-none transition"></textarea>
          </div>

          <div class="bg-amber-50 ring-1 ring-amber-200 p-3 rounded-xl">
            <p class="font-bold text-amber-900 text-[12px] mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-pen-to-square"></i> Koreksi Alamat (jika meleset)
            </p>
            <input type="text" id="input-kelurahan" onchange="syncManualAddressInputs()" placeholder="Kelurahan"
              class="w-full mb-2 bg-white border border-amber-200 rounded-lg px-3 py-2.5 text-[15px] outline-none focus:ring-2 focus:ring-amber-400/40">
            <textarea id="input-alamat" rows="2" onchange="syncManualAddressInputs()" placeholder="Alamat lengkap"
              class="w-full bg-white border border-amber-200 rounded-lg px-3 py-2.5 text-[15px] outline-none focus:ring-2 focus:ring-amber-400/40 resize-none"></textarea>
          </div>
        </div>
      </div>

      <div class="px-4 sm:px-5 py-3 bg-white border-t border-slate-200 flex gap-2.5 shrink-0"
        style="padding-bottom: calc(0.75rem + var(--aman-bawah))">
        <button onclick="closeAbsenModal()"
          class="w-1/3 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-[14px] transition">Batal</button>
        <button id="btn-simpan" onclick="simpanAbsensi()"
          class="w-2/3 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-[14px] shadow-lg shadow-indigo-600/25 flex justify-center items-center gap-2 active:scale-[.98] transition">
          <i class="fa-solid fa-paper-plane"></i> Simpan Kunjungan
        </button>
      </div>
    </div>
  </div>

  <!-- ================= PEMBERITAHUAN ================= -->
  <div id="wadah-pesan" class="fixed left-1/2 -translate-x-1/2 z-[3000] w-[calc(100%-1.5rem)] max-w-sm space-y-2 pointer-events-none"
    style="top: calc(env(safe-area-inset-top, 0px) + 0.75rem)"></div>

  <canvas id="watermark-canvas" class="hidden"></canvas>

  <script>
    const API = '/api/kunjungan';

    // Foto dikecilkan sebelum distempel: HP zaman sekarang menghasilkan foto
    // 3-5 MB yang mustahil dikirim lewat sinyal lapangan dan bikin memori penuh.
    const LEBAR_FOTO_MAKS = 1280;
    const MUTU_JPEG = 0.72;

    // Setelah terkirim, foto ukuran penuh dibuang dari HP dan salinan di pusat
    // bersifat privat (hanya pemilik yang boleh membuka). Sisipan kecil ini yang
    // dipakai sales untuk mengenali riwayat kunjungannya sendiri: ~6 KB per foto,
    // jadi ratusan kunjungan pun masih muat di penyimpanan peramban.
    const LEBAR_SISIPAN = 160;
    const MUTU_SISIPAN = 0.5;

    let map, activeMarker;
    let selectedLat = -0.50218, selectedLng = 117.15364;
    let gpsLat = null, gpsLng = null, gpsAkurasi = null;
    let currentRating = 4;
    let currentImageBase64 = '', currentThumbBase64 = '', rawUnstampedImage = null;
    let sedangMengirim = false;
    let tabAktif = 'map-view';

    // Safari mode penyamaran melempar galat saat menyentuh localStorage, yang bisa
    // mematikan seluruh halaman kalau tidak dijaga.
    const simpanan = {
      baca(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      tulis(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
    };

    let salesName = simpanan.baca('myzona_sales_name') || 'Sales Samarinda';
    let addressInfo = { kelurahan: '', kota: '', alamatLengkap: '' };

    let riwayat = muatRiwayat();

    function muatRiwayat() {
      try {
        const tersimpan = JSON.parse(simpanan.baca('myzona_riwayat') || 'null');
        if (Array.isArray(tersimpan)) return tersimpan;
        // Migrasi dari versi lama yang menyimpan semuanya di 'myzona_proyek'.
        const lama = JSON.parse(simpanan.baca('myzona_proyek') || '[]');
        return lama.map(i => ({ ...i, status: 'pending', waktu: i.waktu || new Date().toISOString() }));
      } catch (err) {
        return [];
      }
    }

    function simpanRiwayat() {
      try {
        localStorage.setItem('myzona_riwayat', JSON.stringify(riwayat));
        return true;
      } catch (err) {
        return false; // kuota penyimpanan HP penuh
      }
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const waktuSingkat = (iso) => {
      const d = new Date(iso);
      return isNaN(d) ? '-' : d.toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
    };

    // Pemberitahuan singkat menggantikan alert(): alert menghentikan seluruh
    // halaman dan di HP menutupi peta sampai ditekan.
    function pesan(teks, jenis = 'info') {
      const gaya = {
        sukses: 'bg-emerald-600', galat: 'bg-red-600', info: 'bg-slate-800', ingat: 'bg-amber-500'
      }[jenis] || 'bg-slate-800';
      const ikon = { sukses: 'fa-circle-check', galat: 'fa-circle-exclamation', info: 'fa-circle-info', ingat: 'fa-triangle-exclamation' }[jenis] || 'fa-circle-info';

      const el = document.createElement('div');
      el.className = `${gaya} text-white text-[13px] font-medium px-3.5 py-2.5 rounded-xl shadow-xl flex items-start gap-2 redup-masuk`;
      el.innerHTML = `<i class="fa-solid ${ikon} mt-0.5 shrink-0"></i><span>${esc(teks)}</span>`;
      document.getElementById('wadah-pesan').appendChild(el);
      setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 3200);
    }

    window.onload = function () {
      document.getElementById('display-sales-name').innerText = salesName;
      initMap();
      terapkanTataLetak();
      renderProyekList();
      updateProyekCount();
      perbaruiBadge();
      sinkronkan();
      window.addEventListener('online', sinkronkan);
      window.addEventListener('offline', perbaruiBadge);
      window.addEventListener('resize', terapkanTataLetak);
      setInterval(sinkronkan, 30000);
    };

    function changeSalesName() {
      const newName = prompt("Nama / ID Anda:", salesName);
      if (newName && newName.trim() !== '') {
        salesName = newName.trim();
        simpanan.tulis('myzona_sales_name', salesName);
        document.getElementById('display-sales-name').innerText = salesName;
      }
    }

    // PETA
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([selectedLat, selectedLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.control.zoom({ position: 'topright' }).addTo(map);

      const customIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="bg-indigo-600 text-white w-9 h-9 rounded-full flex items-center justify-center shadow-lg border-[3px] border-white transform -translate-x-1/2 -translate-y-1/2"><i class="fa-solid fa-location-dot text-sm"></i></div>`,
        iconSize: [36, 36], iconAnchor: [18, 18]
      });

      activeMarker = L.marker([selectedLat, selectedLng], { draggable: true, icon: customIcon }).addTo(map);
      activeMarker.on('dragend', () => updateLocationInfo(activeMarker.getLatLng().lat, activeMarker.getLatLng().lng));
      map.on('click', (e) => { activeMarker.setLatLng(e.latlng); updateLocationInfo(e.latlng.lat, e.latlng.lng); });

      getCurrentLocation();
    }

    function getCurrentLocation() {
      const badge = document.getElementById('gps-accuracy-badge');
      const ikon = document.getElementById('ikon-gps');
      badge.innerText = "Mencari sinyal GPS...";
      badge.className = "text-[11px] font-bold text-slate-600 bg-slate-100 ring-1 ring-slate-200 px-2 py-0.5 rounded-full denyut";
      ikon.className = "fa-solid fa-spinner fa-spin";

      const selesai = () => { ikon.className = "fa-solid fa-crosshairs"; };

      if (!navigator.geolocation) {
        badge.innerText = "GPS tidak tersedia";
        badge.className = "text-[11px] font-bold text-red-700 bg-red-50 ring-1 ring-red-200 px-2 py-0.5 rounded-full";
        return selesai();
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude, lng = position.coords.longitude;
          // Bacaan asli perangkat disimpan terpisah dari pin yang bisa digeser
          // manual, supaya pemilik bisa melihat kalau keduanya berjauhan.
          gpsLat = lat; gpsLng = lng; gpsAkurasi = position.coords.accuracy;
          badge.innerText = `Akurasi ±${Math.round(position.coords.accuracy)} m`;
          badge.className = "text-[11px] font-bold text-indigo-700 bg-indigo-50 ring-1 ring-indigo-100 px-2 py-0.5 rounded-full";
          map.setView([lat, lng], 17);
          activeMarker.setLatLng([lat, lng]);
          updateLocationInfo(lat, lng);
          selesai();
        },
        () => {
          badge.innerText = "GPS gagal — nyalakan lokasi";
          badge.className = "text-[11px] font-bold text-red-700 bg-red-50 ring-1 ring-red-200 px-2 py-0.5 rounded-full";
          selesai();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function updateLocationInfo(lat, lng) {
      selectedLat = lat; selectedLng = lng;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        if (data && data.address) {
          addressInfo.kelurahan = data.address.village || data.address.suburb || 'Samarinda';
          addressInfo.alamatLengkap = data.display_name;
        }
      } catch (err) {
        addressInfo.kelurahan = 'Area Samarinda';
        addressInfo.alamatLengkap = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
      }
      document.getElementById('live-address-title').innerText = addressInfo.kelurahan;
      document.getElementById('live-address-detail').innerText = addressInfo.alamatLengkap;
    }

    // TATA LETAK & TAB
    const layarLebar = () => window.matchMedia('(min-width: 1024px)').matches;

    function switchTab(tabName) {
      tabAktif = tabName;
      terapkanTataLetak();
      if (tabName === 'list-view') renderProyekList();
    }

    // Di layar lebar kedua panel tampil bersamaan, jadi tab tidak menyembunyikan
    // apa pun. Di HP hanya satu yang tampil: panel "Absen Disini" melayang di
    // lapisan atas dan akan menutupi daftar riwayat kalau peta dibiarkan hidup.
    function terapkanTataLetak() {
      const viewMap = document.getElementById('view-map');
      const viewList = document.getElementById('view-list');
      const lebar = layarLebar();

      if (lebar) {
        viewMap.classList.remove('hidden');
        viewList.classList.remove('hidden');
      } else if (tabAktif === 'list-view') {
        viewMap.classList.add('hidden');
        viewList.classList.remove('hidden');
      } else {
        viewList.classList.add('hidden');
        viewMap.classList.remove('hidden');
      }

      const aktif = 'py-2.5 flex flex-col items-center gap-0.5 text-[11px] font-semibold transition text-indigo-700 bg-indigo-50';
      const pasif = 'py-2.5 flex flex-col items-center gap-0.5 text-[11px] font-semibold transition text-slate-400';
      document.getElementById('tab-map').className = tabAktif === 'map-view' ? aktif : pasif;
      document.getElementById('tab-list').className = tabAktif === 'list-view' ? aktif : pasif;

      if (map) setTimeout(() => map.invalidateSize(), 150);
    }

    // MODAL
    function openAbsenModal() {
      document.getElementById('input-nama-proyek').value = '';
      document.getElementById('preview-container').classList.add('hidden');
      document.getElementById('preview-placeholder').classList.remove('hidden');
      currentImageBase64 = ''; currentThumbBase64 = ''; rawUnstampedImage = null;

      document.getElementById('input-kelurahan').value = addressInfo.kelurahan;
      document.getElementById('input-alamat').value = addressInfo.alamatLengkap;
      document.getElementById('input-deskripsi').value = '';

      document.getElementById('optional-details').classList.add('hidden');
      document.getElementById('toggle-icon').className = "fa-solid fa-chevron-down text-[11px]";
      setRating(4);
      document.getElementById('modal-absen').classList.replace('hidden', 'flex');
    }
    function closeAbsenModal() { document.getElementById('modal-absen').classList.replace('flex', 'hidden'); }

    function toggleOptionalDetails() {
      const detailSection = document.getElementById('optional-details');
      const icon = document.getElementById('toggle-icon');
      if (detailSection.classList.contains('hidden')) {
        detailSection.classList.remove('hidden'); icon.className = "fa-solid fa-chevron-up text-[11px]";
        setTimeout(() => detailSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
      } else {
        detailSection.classList.add('hidden'); icon.className = "fa-solid fa-chevron-down text-[11px]";
      }
    }

    // KAMERA & WATERMARK
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () { rawUnstampedImage = img; processWatermarkOnCanvas(img); };
        img.onerror = function () { pesan("Foto tidak bisa dibaca, coba ambil ulang.", 'galat'); };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = ''; // supaya memilih file yang sama lagi tetap memicu onchange
    }

    function processWatermarkOnCanvas(img) {
      const canvas = document.getElementById('watermark-canvas');
      const ctx = canvas.getContext('2d');

      const skala = Math.min(1, LEBAR_FOTO_MAKS / img.width);
      canvas.width = Math.round(img.width * skala);
      canvas.height = Math.round(img.height * skala);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const barHeight = Math.max(60, Math.floor(canvas.height * 0.15));
      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

      const fontSize = Math.max(12, Math.floor(barHeight * 0.25));
      ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${fontSize}px sans-serif`;
      const kel = document.getElementById('input-kelurahan').value || addressInfo.kelurahan;
      ctx.fillText(`📍 ${kel}`, 20, canvas.height - barHeight + fontSize + 10);

      ctx.fillStyle = '#ffffff'; ctx.font = `${Math.floor(fontSize * 0.9)}px monospace`;
      ctx.fillText(`Lat: ${selectedLat.toFixed(5)}, Lng: ${selectedLng.toFixed(5)}`, 20, canvas.height - barHeight + (fontSize * 2) + 12);

      ctx.fillStyle = '#cbd5e1';
      const time = new Date().toLocaleString('id-ID', { timeStyle: 'short', dateStyle: 'short' });
      ctx.fillText(`👤 ${salesName} | 🕒 ${time}`, 20, canvas.height - 15);

      currentImageBase64 = canvas.toDataURL('image/jpeg', MUTU_JPEG);
      currentThumbBase64 = buatSisipan(canvas);
      document.getElementById('img-preview').src = currentImageBase64;
      document.getElementById('preview-container').classList.remove('hidden');
      document.getElementById('preview-placeholder').classList.add('hidden');
    }

    // Sisipan dibuat dari kanvas yang sudah berstempel, jadi keterangan lokasi
    // tetap terbaca walau kecil.
    function buatSisipan(sumber) {
      const kecil = document.createElement('canvas');
      const skala = Math.min(1, LEBAR_SISIPAN / sumber.width);
      kecil.width = Math.round(sumber.width * skala);
      kecil.height = Math.round(sumber.height * skala);
      kecil.getContext('2d').drawImage(sumber, 0, 0, kecil.width, kecil.height);
      return kecil.toDataURL('image/jpeg', MUTU_SISIPAN);
    }

    function syncManualAddressInputs() { if (rawUnstampedImage) processWatermarkOnCanvas(rawUnstampedImage); }

    function setRating(stars) {
      currentRating = stars;
      document.getElementById('rating-stars').querySelectorAll('i').forEach((el, i) => {
        el.className = (i < stars ? "fa-solid fa-star" : "fa-regular fa-star text-slate-300")
          + " cursor-pointer p-1 active:scale-90 transition";
      });
    }

    // SIMPAN
    function simpanAbsensi() {
      const nama = document.getElementById('input-nama-proyek').value.trim();
      if (!currentImageBase64) return pesan("Foto toko wajib diisi.", 'ingat');
      if (!nama) {
        document.getElementById('input-nama-proyek').focus();
        return pesan("Nama toko wajib diisi.", 'ingat');
      }

      const kunjungan = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        salesName,
        nama,
        kelurahan: document.getElementById('input-kelurahan').value || addressInfo.kelurahan,
        alamat: document.getElementById('input-alamat').value || addressInfo.alamatLengkap,
        lat: selectedLat, lng: selectedLng,
        gpsLat, gpsLng, akurasi: gpsAkurasi,
        rating: currentRating,
        foto: currentImageBase64,
        thumb: currentThumbBase64,
        deskripsi: document.getElementById('input-deskripsi').value,
        waktu: new Date().toISOString(),
        status: 'pending'
      };

      riwayat.unshift(kunjungan);
      if (!simpanRiwayat()) {
        riwayat.shift();
        return pesan("Memori HP penuh. Sambungkan internet dulu agar data tertunda terkirim.", 'galat');
      }

      closeAbsenModal();
      updateProyekCount();
      switchTab('list-view');
      pesan(`Kunjungan "${nama}" tersimpan.`, 'sukses');
      sinkronkan();
    }

    function updateProyekCount() {
      document.getElementById('count-proyek').innerText = riwayat.length;
      document.getElementById('count-proyek-lg').innerText = riwayat.length;
    }

    // SINKRONISASI KE SERVER
    async function sinkronkan() {
      if (sedangMengirim || !navigator.onLine) { perbaruiBadge(); return; }
      const antrean = riwayat.filter(i => i.status === 'pending');
      if (antrean.length === 0) { perbaruiBadge(); return; }

      sedangMengirim = true;
      perbaruiBadge();
      try {
        for (const item of antrean) {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item)
          });

          if (res.ok) {
            item.status = 'synced';
            delete item.foto; // base64 ukuran penuh dibuang, sisipan kecil tetap disimpan
            simpanRiwayat();
            renderProyekList();
          } else if (res.status >= 400 && res.status < 500) {
            // Data ditolak permanen; menunggu tidak akan menolong.
            item.status = 'gagal';
            item.pesanGagal = (await res.json().catch(() => ({}))).error || 'Ditolak server';
            simpanRiwayat();
            renderProyekList();
          } else {
            break; // gangguan server/jaringan, coba lagi nanti
          }
        }
      } catch (err) {
        // sinyal putus di tengah jalan, antrean tetap tersimpan
      } finally {
        sedangMengirim = false;
        perbaruiBadge();
      }
    }

    function sinkronkanSekarang() {
      if (!navigator.onLine) return pesan("Belum ada internet. Data aman di HP dan terkirim otomatis nanti.", 'ingat');
      const tertunda = riwayat.filter(i => i.status === 'pending').length;
      if (!tertunda) return pesan("Semua kunjungan sudah masuk pusat data.", 'sukses');
      pesan(`Mengirim ${tertunda} kunjungan...`, 'info');
      sinkronkan();
    }

    function perbaruiBadge() {
      const badge = document.getElementById('sync-badge');
      const dot = document.getElementById('sync-dot');
      const teks = document.getElementById('sync-text');
      const tertunda = riwayat.filter(i => i.status === 'pending').length;
      const gagal = riwayat.filter(i => i.status === 'gagal').length;
      const dasar = "shrink-0 text-[11px] font-semibold px-2.5 sm:px-3 py-1.5 rounded-full text-white flex items-center gap-1.5 shadow-sm ring-1 ring-white/20 active:scale-95 transition ";

      dot.className = "w-1.5 h-1.5 rounded-full bg-white";

      if (!navigator.onLine) {
        badge.className = dasar + "bg-slate-500";
        teks.innerText = tertunda ? `Offline · ${tertunda}` : 'Offline';
      } else if (sedangMengirim) {
        badge.className = dasar + "bg-sky-500";
        dot.className = "w-1.5 h-1.5 rounded-full bg-white denyut";
        teks.innerText = 'Mengirim...';
      } else if (gagal) {
        badge.className = dasar + "bg-red-500";
        teks.innerText = `${gagal} gagal`;
      } else if (tertunda) {
        badge.className = dasar + "bg-amber-500";
        dot.className = "w-1.5 h-1.5 rounded-full bg-white denyut";
        teks.innerText = `${tertunda} belum terkirim`;
      } else {
        badge.className = dasar + "bg-emerald-500";
        teks.innerText = 'Tersimpan';
      }
    }

    // DAFTAR RIWAYAT
    function renderProyekList() {
      const container = document.getElementById('proyek-container');
      const cari = document.getElementById('search-input').value.toLowerCase();
      const hasil = riwayat.filter(i =>
        (i.nama || '').toLowerCase().includes(cari) || (i.kelurahan || '').toLowerCase().includes(cari)
      );

      if (hasil.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 px-6">
            <div class="w-16 h-16 rounded-2xl bg-slate-200 text-slate-400 grid place-items-center mx-auto mb-3 text-2xl">
              <i class="fa-solid fa-store"></i>
            </div>
            <p class="font-semibold text-slate-600 text-sm">${riwayat.length ? 'Tidak ada yang cocok' : 'Belum ada kunjungan'}</p>
            <p class="text-[12px] text-slate-400 mt-1">${riwayat.length ? 'Coba kata kunci lain.' : 'Tekan "Absen Disini" saat sampai di toko.'}</p>
          </div>`;
        return;
      }

      const lencana = {
        pending: `<span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-clock"></i> Belum terkirim</span>`,
        synced: `<span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-check"></i> Terkirim</span>`,
        gagal: `<span class="text-[10px] bg-red-100 text-red-800 px-2 py-0.5 rounded-full font-bold"><i class="fa-solid fa-xmark"></i> Gagal</span>`
      };

      container.innerHTML = hasil.map((item) => `
        <article class="bg-white rounded-2xl ring-1 ring-slate-200 kartu-lembut overflow-hidden flex">
          <img src="${esc(item.thumb || item.foto || '')}" alt="" loading="lazy"
            class="w-24 sm:w-28 object-cover bg-slate-100 shrink-0">
          <div class="p-3 flex-1 flex flex-col min-w-0">
            <div class="flex justify-between items-start gap-2">
              <h4 class="font-bold text-slate-900 text-[14px] leading-tight truncate">${esc(item.nama)}</h4>
              <span class="text-[11px] text-amber-500 font-bold whitespace-nowrap shrink-0">
                <i class="fa-solid fa-star text-[10px]"></i> ${esc(item.rating ?? '-')}
              </span>
            </div>

            <div class="mt-1.5">${lencana[item.status] || ''}</div>

            <p class="text-[11px] text-slate-500 truncate mt-1.5">
              <i class="fa-solid fa-location-dot text-indigo-500"></i> ${esc(item.kelurahan)}
            </p>

            ${item.deskripsi ? `
              <div class="text-[11px] text-slate-600 bg-slate-50 ring-1 ring-slate-100 px-2 py-1.5 rounded-lg mt-1.5">
                <p class="baris-2">${esc(item.deskripsi)}</p>
              </div>` : ''}

            ${item.status === 'gagal' && item.pesanGagal ? `
              <p class="text-[10px] text-red-700 bg-red-50 ring-1 ring-red-100 px-2 py-1 rounded-lg mt-1.5">${esc(item.pesanGagal)}</p>` : ''}

            <div class="flex justify-between items-center gap-2 mt-auto pt-2.5">
              <span class="text-[10px] text-slate-400 truncate">${esc(waktuSingkat(item.waktu))}</span>
              <div class="flex gap-1.5 shrink-0">
                <button onclick="shareKeWhatsApp('${esc(item.id)}')"
                  class="text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1 active:scale-95 transition">
                  <i class="fa-brands fa-whatsapp text-[13px]"></i> Kirim
                </button>
                <button onclick="hapusProyek('${esc(item.id)}')" aria-label="Hapus dari HP"
                  class="w-8 h-8 grid place-items-center rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 text-[12px] active:scale-95 transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    // SHARE WHATSAPP
    function shareKeWhatsApp(id) {
      const data = riwayat.find(i => String(i.id) === String(id));
      if (!data) return;

      let waText = `*LAPORAN KUNJUNGAN SALES*\n`;
      waText += `----------------------------\n`;
      waText += `👤 *Sales:* ${data.salesName}\n`;
      waText += `🏢 *Toko:* ${data.nama}\n`;
      waText += `📍 *Area:* ${data.kelurahan}\n`;
      waText += `📅 *Waktu:* ${waktuSingkat(data.waktu)}\n`;
      waText += `⭐ *Rating:* ${data.rating}/5\n`;
      if (data.deskripsi) waText += `\n*📦 Catatan Pesanan:*\n${data.deskripsi}\n`;
      // Foto sengaja tidak dilampirkan: salinan di pusat bersifat privat dan
      // hanya terbuka lewat dashboard pemilik.
      waText += `\n*🗺️ Titik Peta (GPS):*\nhttps://www.google.com/maps?q=${data.lat},${data.lng}\n`;

      window.open(`https://wa.me/?text=${encodeURIComponent(waText)}`, '_blank');
    }

    function hapusProyek(id) {
      const data = riwayat.find(i => String(i.id) === String(id));
      if (!data) return;

      const teks = data.status === 'synced'
        ? "Hapus dari HP ini? Data yang sudah terkirim tetap tersimpan di pusat."
        : "Data ini BELUM terkirim ke pusat. Kalau dihapus, hilang selamanya. Lanjutkan?";
      if (!confirm(teks)) return;

      riwayat = riwayat.filter(i => String(i.id) !== String(id));
      simpanRiwayat();
      renderProyekList();
      updateProyekCount();
      perbaruiBadge();
      pesan("Kunjungan dihapus dari HP ini.", 'info');
    }

    // EXPORT CSV
    function exportToCSV() {
      if (riwayat.length === 0) return pesan("Belum ada data untuk diexport.", 'ingat');
      const kolom = ["Waktu Kunjungan", "Nama Toko", "Kelurahan", "Alamat Lengkap", "Rating", "Latitude", "Longitude", "Catatan Pesanan", "Nama Sales", "Status"];
      const sel = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;

      const baris = riwayat.map(r => [
        waktuSingkat(r.waktu), r.nama, r.kelurahan, r.alamat, r.rating, r.lat, r.lng, r.deskripsi, r.salesName, r.status
      ].map(sel).join(','));

      // ﻿ (BOM) supaya huruf beraksen tidak berantakan saat dibuka di Excel.
      const isi = '﻿' + kolom.map(sel).join(',') + '\r\n' + baris.join('\r\n');
      const url = URL.createObjectURL(new Blob([isi], { type: 'text/csv;charset=utf-8;' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `Laporan_Sales_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
